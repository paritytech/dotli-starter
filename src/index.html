<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Starter Kit</title>
        <meta name="theme-color" content="#F4E6D8" media="(prefers-color-scheme: light)" />
        <meta name="theme-color" content="#5D4037" media="(prefers-color-scheme: dark)" />
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            body {
                font-family: system-ui, sans-serif;
                max-width: 520px;
                margin: 0 auto;
                padding: 2rem 1rem;
                background: #000;
                color: #e4e4e4;
            }
            h1 {
                font-size: 1.3rem;
                margin-bottom: 1.5rem;
            }
            section {
                margin-bottom: 1.5rem;
            }
            section h2 {
                font-size: 0.85rem;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                color: #888;
                margin-bottom: 0.5rem;
            }
            #greeting {
                font-size: 1.1rem;
                min-height: 2.5rem;
            }
            #greeting .name {
                font-weight: 700;
            }
            #greeting .addr {
                display: block;
                font-size: 0.75rem;
                color: #888;
                font-family: monospace;
                margin-top: 2px;
            }
            .status {
                font-size: 0.8rem;
                color: #888;
                margin-bottom: 0.5rem;
            }
            input {
                width: 100%;
                padding: 0.4rem 0.5rem;
                border: 1px solid #333;
                border-radius: 4px;
                font-size: 0.85rem;
                margin-bottom: 0.5rem;
                background: #111;
                color: #e4e4e4;
            }
            button {
                padding: 0.5rem 1rem;
                border: 1px solid #333;
                border-radius: 4px;
                background: #fff;
                color: #000;
                font-size: 0.85rem;
                cursor: pointer;
                width: 100%;
                margin-bottom: 0.35rem;
            }
            button:hover:not(:disabled) {
                background: #ccc;
            }
            button:disabled {
                opacity: 0.3;
                cursor: not-allowed;
            }
            button.secondary {
                background: #111;
                color: #e4e4e4;
            }
            button.secondary:hover:not(:disabled) {
                background: #222;
            }
            .row {
                display: flex;
                gap: 0.35rem;
            }
            .row button {
                flex: 1;
            }
            #log {
                background: #111;
                border: 1px solid #333;
                border-radius: 4px;
                padding: 0.5rem;
                min-height: 60px;
                max-height: 200px;
                overflow-y: auto;
                font-family: monospace;
                font-size: 0.7rem;
                line-height: 1.6;
                white-space: pre-wrap;
                word-break: break-all;
            }
            #log .ts {
                color: #999;
            }
            #log .ok {
                color: #16a34a;
            }
            #log .err {
                color: #dc2626;
            }
            #log .info {
                color: #e4e4e4;
            }
            #btn-clear {
                width: auto;
                background: #111;
                color: #e4e4e4;
                font-size: 0.7rem;
                padding: 0.25rem 0.75rem;
                margin-top: 0.35rem;
            }
            .drop-zone {
                border: 2px dashed #333;
                border-radius: 8px;
                padding: 2rem 1rem;
                text-align: center;
                color: #888;
                font-size: 0.85rem;
                cursor: pointer;
                transition: border-color 0.2s, background 0.2s;
                margin-bottom: 0.5rem;
            }
            .drop-zone.over {
                border-color: #fff;
                background: #1a1a1a;
            }
            .drop-zone.has-file {
                border-color: #16a34a;
                border-style: solid;
            }
            .drop-zone input[type="file"] {
                display: none;
            }
            .file-entry {
                font-size: 0.8rem;
                color: #e4e4e4;
                margin-bottom: 0.25rem;
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 0.25rem 0.5rem;
                background: #111;
                border: 1px solid #333;
                border-radius: 4px;
            }
            .file-entry .file-name {
                font-family: monospace;
                word-break: break-all;
            }
            .file-entry .file-size {
                color: #888;
                white-space: nowrap;
                margin-left: 0.5rem;
            }
            .file-entry .file-remove {
                background: none;
                border: none;
                color: #dc2626;
                cursor: pointer;
                font-size: 0.8rem;
                padding: 0;
                margin-left: 0.5rem;
                width: auto;
            }
            #file-list {
                margin-bottom: 0.5rem;
            }
            .recipient-input-row {
                display: flex;
                gap: 0.35rem;
                margin-bottom: 0.5rem;
            }
            .recipient-input-row input {
                flex: 1;
                margin-bottom: 0;
            }
            .recipient-input-row button {
                width: auto;
                white-space: nowrap;
                margin-bottom: 0;
            }
            .recipient-list {
                list-style: none;
                margin: 0;
                padding: 0;
            }
            .recipient-list li {
                display: flex;
                align-items: center;
                justify-content: space-between;
                font-family: monospace;
                font-size: 0.75rem;
                padding: 0.3rem 0.5rem;
                background: #111;
                border: 1px solid #333;
                border-radius: 4px;
                margin-bottom: 0.25rem;
                word-break: break-all;
            }
            .recipient-list li button {
                background: none;
                border: none;
                color: #dc2626;
                cursor: pointer;
                font-size: 0.75rem;
                padding: 0;
                margin-left: 0.5rem;
                width: auto;
                flex-shrink: 0;
            }
            .recipient-count {
                font-size: 0.75rem;
                color: #888;
                margin-bottom: 0.35rem;
            }
            .qr-card {
                display: inline-block;
                text-align: center;
                background: #fff;
                border-radius: 8px;
                padding: 0.75rem;
                margin: 0.25rem;
                vertical-align: top;
            }
            .qr-card canvas {
                display: block;
                margin: 0 auto 0.5rem;
            }
            .qr-card .qr-name {
                font-size: 0.8rem;
                font-weight: 700;
                color: #000;
            }
            #qr-list {
                display: flex;
                flex-wrap: wrap;
                gap: 0.5rem;
            }
        </style>
    </head>
    <body>
        <h1>Starter Kit</h1>

        <!-- Account: shows greeting once logged in, or a prompt to log in -->
        <section>
            <h2>Account</h2>
            <div id="greeting">Loading...</div>
        </section>

        <!-- Connection: shows SDK status and chain info -->
        <section>
            <h2>Connection</h2>
            <p class="status"><span id="status-text">Connecting...</span></p>
            <p style="font-size: 0.85rem">Paseo Asset Hub (Testnet)</p>
        </section>

        <!-- System.remark: sign and submit an on-chain remark (waits for finalization) -->
        <section>
            <h2>System.remark</h2>
            <input
                id="remark-input"
                type="text"
                value="Hello from starter kit!"
            />
            <button id="btn-remark" disabled>Sign & Submit</button>
        </section>

        <!-- Sign raw: sign an arbitrary message without submitting on-chain -->
        <section>
            <h2>Sign Raw Message</h2>
            <input id="raw-input" type="text" value="Hello from starter kit!" />
            <button id="btn-sign-raw" class="secondary" disabled>
                Sign Raw
            </button>
        </section>

        <!-- Host storage: persist JSON data scoped to this app -->
        <section>
            <h2>Host Storage</h2>
            <input
                id="storage-key"
                type="text"
                value="demo_key"
                placeholder="key"
            />
            <input
                id="storage-value"
                type="text"
                value='{"hello":"world"}'
                placeholder="JSON value"
            />
            <div class="row">
                <button id="btn-stor-write" class="secondary" disabled>
                    Write
                </button>
                <button id="btn-stor-read" class="secondary" disabled>
                    Read
                </button>
                <button id="btn-stor-clear" class="secondary" disabled>
                    Clear
                </button>
            </div>
        </section>

        <!-- Chain read: query on-chain state through the Host's managed connection -->
        <section>
            <h2>Chain Read</h2>
            <button id="btn-chain-read" class="secondary" disabled>
                Read Finalized Block
            </button>
        </section>

        <!-- Drag File: upload a file and assign recipient wallet addresses -->
        <section>
            <h2>Drag File</h2>
            <div class="drop-zone" id="drop-zone">
                <p>Drag & drop files here, or click to browse</p>
                <input type="file" id="file-input" multiple />
            </div>
            <div id="file-list"></div>
            <div class="recipient-input-row">
                <input
                    id="recipient-input"
                    type="text"
                    placeholder="Recipient name (e.g. Alice)"
                />
                <button id="btn-add-recipient" class="secondary">Add</button>
            </div>
            <div id="recipient-count" class="recipient-count"></div>
            <ul id="recipient-list" class="recipient-list"></ul>
            <div class="row">
                <button id="btn-send" disabled>Send</button>
                <button id="btn-demo" class="secondary">Demo App</button>
            </div>
        </section>

        <!-- Recipient Keys: QR codes shown after send -->
        <section id="qr-section" style="display:none">
            <h2>Recipient Keys</h2>
            <div id="qr-list"></div>
        </section>

        <!-- Log: timestamped output for all SDK operations -->
        <section>
            <h2>Log</h2>
            <div id="log"></div>
            <button id="btn-clear">Clear</button>
        </section>

        <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
        <script type="importmap">
            {
                "imports": {
                    "@novasamatech/product-sdk": "https://esm.sh/@novasamatech/product-sdk@0.6.1",
                    "polkadot-api": "https://esm.sh/polkadot-api@1.23.3",
                    "polkadot-api/utils": "https://esm.sh/polkadot-api@1.23.3/utils",
                    "polkadot-api/ws-provider": "https://esm.sh/polkadot-api@1.23.3/ws-provider",
                    "polkadot-api/polkadot-sdk-compat": "https://esm.sh/polkadot-api@1.23.3/polkadot-sdk-compat",
                    "@polkadot/keyring": "https://esm.sh/@polkadot/keyring@14.0.2",
                    "@polkadot/util-crypto": "https://esm.sh/@polkadot/util-crypto@14.0.2",
                    "@polkadot-api/signer": "https://esm.sh/@polkadot-api/signer@0.2.13",
                    "multiformats/cid": "https://esm.sh/multiformats@13.4.2/cid",
                    "multiformats/hashes/digest": "https://esm.sh/multiformats@13.4.2/hashes/digest",
                    "@bcts/envelope": "https://esm.sh/@bcts/envelope@1.0.0-alpha.22"
                }
            }
        </script>
        <script type="module" src="main.js"></script>
    </body>
</html>
