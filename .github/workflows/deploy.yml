name: Deploy
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      skip-cache:
        description: 'Skip deployment cache and force redeploy'
        type: boolean
        default: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build site
        run: npm ci && npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: src/

  deploy:
    name: Deploy
    needs: build
    uses: paritytech/dotns-sdk/.github/workflows/deploy.yml@main
    with:
      basename: vaultuploader
      artifact-name: site
      mode: production
      register-base: true
    secrets:
      mnemonic: ${{ secrets.DOTNS_MNEMONIC }}
